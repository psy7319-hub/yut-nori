<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리 반 전통 2말 윷놀이 토너먼트</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&display=swap');

    body {
      font-family: 'Pretendard', sans-serif;
      background-color: #f4ebd9;
      background-image: 
        radial-gradient(#d6c5a3 1px, transparent 1px),
        radial-gradient(#e5d7bc 1px, #f4ebd9 1px);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
      user-select: none;
    }

    .font-trad {
      font-family: 'Gowun Batang', serif;
    }

    /* 전통 창살 & 멍석 느낌 윷판 */
    .yut-mat {
      background: radial-gradient(circle at center, #fdf8ee 0%, #f1e3c6 75%, #e2cfa8 100%);
      box-shadow: 
        inset 0 0 30px rgba(139, 90, 43, 0.25),
        0 12px 28px -6px rgba(92, 58, 24, 0.3);
      border: 8px solid #6b3e1e;
      outline: 3px solid #c59b5f;
      outline-offset: -12px;
    }

    /* 윷 던지기 애니메이션 */
    @keyframes yutToss {
      0% { transform: translateY(40px) scale(0.7) rotate(0deg); opacity: 0; }
      35% { transform: translateY(-90px) scale(1.25) rotate(220deg); opacity: 1; }
      70% { transform: translateY(12px) scale(0.95) rotate(520deg); }
      85% { transform: translateY(-10px) scale(1.03) rotate(700deg); }
      100% { transform: translateY(0px) scale(1) rotate(720deg); opacity: 1; }
    }

    .animate-yut-0 { animation: yutToss 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .animate-yut-1 { animation: yutToss 0.72s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .animate-yut-2 { animation: yutToss 0.68s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .animate-yut-3 { animation: yutToss 0.76s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

    @keyframes popBadge {
      0% { transform: scale(0.3); opacity: 0; }
      70% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-badge { animation: popBadge 0.4s ease-out 0.45s both; }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      50% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
    }
    .piece-glow { animation: pulseGlow 1.4s infinite; }
  </style>
</head>
<body class="min-h-screen text-stone-800">
  <div id="app"></div>

  <script>
    // =========================================================================
    // 0. Web Audio API 전통 효과음 생성기 (외부 파일 불필요)
    // =========================================================================
    const AudioFX = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      },
      playWoodClack(delay = 0, freq = 320) {
        this.init();
        if (!this.ctx) return;
        const t = this.ctx.currentTime + delay;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, t);
        osc.frequency.exponentialRampToValueAtTime(110, t + 0.08);
        gain.gain.setValueAtTime(0.35, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.09);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.09);
      },
      playRoll() {
        this.playWoodClack(0.05, 420);
        this.playWoodClack(0.18, 360);
        this.playWoodClack(0.35, 290);
        this.playWoodClack(0.48, 340);
      },
      playFanfare() {
        this.init();
        if (!this.ctx) return;
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((f, i) => {
          const t = this.ctx.currentTime + i * 0.09;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, t);
          gain.gain.setValueAtTime(0.25, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.25);
        });
      },
      playCatch() {
        this.init();
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, t);
        osc.frequency.exponentialRampToValueAtTime(620, t + 0.25);
        gain.gain.setValueAtTime(0.28, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.28);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.28);
      }
    };

    // =========================================================================
    // 1. 윷놀이 판 좌표 및 규칙 엔진 (29개 노드)
    // =========================================================================
    const NODES = {
      0: { x: 89, y: 89, label: '출발·도착', big: true, corner: true },
      1: { x: 89, y: 71.5 }, 2: { x: 89, y: 54 }, 3: { x: 89, y: 36.5 }, 4: { x: 89, y: 19 },
      5: { x: 89, y: 11, label: '지름길', big: true, corner: true },
      6: { x: 71.5, y: 11 }, 7: { x: 54, y: 11 }, 8: { x: 36.5, y: 11 }, 9: { x: 19, y: 11 },
      10: { x: 11, y: 11, label: '지름길', big: true, corner: true },
      11: { x: 11, y: 28.5 }, 12: { x: 11, y: 46 }, 13: { x: 11, y: 63.5 }, 14: { x: 11, y: 81 },
      15: { x: 11, y: 89, label: '모서리', big: true, corner: true },
      16: { x: 28.5, y: 89 }, 17: { x: 46, y: 89 }, 18: { x: 63.5, y: 89 }, 19: { x: 81, y: 89 },
      20: { x: 74, y: 26 }, 21: { x: 61.5, y: 38.5 },
      22: { x: 50, y: 50, label: '방(중앙)', big: true, center: true },
      23: { x: 38.5, y: 61.5 }, 24: { x: 26, y: 74 },
      25: { x: 26, y: 26 }, 26: { x: 38.5, y: 38.5 },
      27: { x: 61.5, y: 61.5 }, 28: { x: 74, y: 74 }
    };

    function getNextStep(pos, prevPos) {
      if (pos === -1) return 1;
      if (pos === 0 && prevPos !== -1) return 99;
      if (pos === 5) return 20;
      if (pos === 10) return 25;
      if (pos === 22) return prevPos === 21 ? 23 : 27;
      if (pos === 24) return 15;
      if (pos === 28) return 0;
      if (pos === 19) return 0;
      if (pos >= 20 && pos <= 23) return pos + 1;
      if (pos >= 25 && pos <= 27) return pos + 1;
      return pos + 1;
    }

    function calculateDestination(startPos, steps, prevPos = -1) {
      if (steps === -1) {
        if (startPos === -1) return -1;
        if (startPos === 1) return 0;
        if (startPos === 0) return 19;
        if (startPos === 20) return 5;
        if (startPos === 25) return 10;
        if (startPos === 23) return 22;
        if (startPos === 27) return 22;
        if (startPos === 15 && prevPos === 24) return 24;
        return startPos - 1;
      }
      let curr = startPos;
      let prev = prevPos;
      for (let i = 0; i < steps; i++) {
        const next = getNextStep(curr, prev);
        if (next === 99) return 99;
        prev = curr;
        curr = next;
      }
      return curr;
    }

    // 4개 윷가락 상태 생성 (true = 배(평평한 면), false = 등(둥근 면))
    // 빽도 표시를 위해 0번 윷가락이 배(true)이고 나머지가 등(false)일 때 빽도 처리
    function rollYutSticks() {
      const r = Math.random();
      let sticks = [false, false, false, false];
      let result = null;

      if (r < 0.03) {
        // 빽도 (0번 윷만 배)
        sticks = [true, false, false, false];
        result = { name: '빽도', steps: -1, extra: false, sticks, isBackDo: true, desc: '뒤로 1칸!' };
      } else if (r < 0.28) {
        // 도 (1~3번 중 하나만 배)
        const idx = Math.floor(Math.random() * 3) + 1;
        sticks[idx] = true;
        result = { name: '도', steps: 1, extra: false, sticks, isBackDo: false, desc: '앞으로 1칸' };
      } else if (r < 0.65) {
        // 개 (2개 배)
        const idxs = [0, 1, 2, 3].sort(() => Math.random() - 0.5).slice(0, 2);
        idxs.forEach(i => sticks[i] = true);
        result = { name: '개', steps: 2, extra: false, sticks, isBackDo: false, desc: '앞으로 2칸' };
      } else if (r < 0.90) {
        // 걸 (3개 배)
        const flat = Math.floor(Math.random() * 4);
        sticks = [0, 1, 2, 3].map(i => i !== flat);
        result = { name: '걸', steps: 3, extra: false, sticks, isBackDo: false, desc: '앞으로 3칸' };
      } else if (r < 0.96) {
        // 윷 (4개 모두 배)
        sticks = [true, true, true, true];
        result = { name: '윷', steps: 4, extra: true, sticks, isBackDo: false, desc: '4칸 + 한 번 더!' };
      } else {
        // 모 (4개 모두 등)
        sticks = [false, false, false, false];
        result = { name: '모', steps: 5, extra: true, sticks, isBackDo: false, desc: '5칸 + 한 번 더!' };
      }
      return result;
    }

    // =========================================================================
    // 2. 전역 상태 관리
    // =========================================================================
    const state = {
      mode: null,
      roomCode: '',
      currentUser: null,
      connStatus: 'disconnected',
      errorMsg: '',
      players: {},
      matches: {},
      activeMatchId: null,
      selectedMoveIdx: 0,
      rollAnimKey: 0,
      peer: null,
      connections: [],
      hostConn: null
    };

    function setState(patch) {
      Object.assign(state, patch);
      render();
    }

    // =========================================================================
    // 3. P2P 통신 로직 (PeerJS)
    // =========================================================================
    function broadcastState() {
      const payload = {
        type: 'SYNC_STATE',
        players: state.players,
        matches: state.matches
      };
      state.connections.forEach(conn => {
        if (conn && conn.open) conn.send(payload);
      });
    }

    function applyMatchUpdateOnHost(updatedMatch) {
      const nextMatches = { ...state.matches, [updatedMatch.id]: updatedMatch };
      if (updatedMatch.winner) {
        const nextRound = updatedMatch.round + 1;
        const nextIndex = Math.floor(updatedMatch.index / 2);
        const nextMatchId = `R${nextRound}_M${nextIndex}`;
        if (nextMatches[nextMatchId]) {
          const slot = updatedMatch.index % 2 === 0 ? 'p1' : 'p2';
          nextMatches[nextMatchId] = { ...nextMatches[nextMatchId], [slot]: updatedMatch.winner };
        }
      }
      state.matches = nextMatches;
      broadcastState();
      render();
    }

    function startHost() {
      AudioFX.init();
      if (typeof Peer === 'undefined') {
        setState({ errorMsg: '인터넷 연결 또는 PeerJS 라이브러리 로딩을 확인해주세요.' });
        return;
      }
      const code = String(Math.floor(1000 + Math.random() * 9000));
      setState({ mode: 'host', roomCode: code, connStatus: 'connecting', errorMsg: '' });

      const peer = new Peer(`yut-class-${code}`);
      state.peer = peer;

      peer.on('open', () => setState({ connStatus: 'connected' }));

      peer.on('connection', (conn) => {
        state.connections.push(conn);
        conn.on('open', () => {
          conn.send({ type: 'SYNC_STATE', players: state.players, matches: state.matches });
        });
        conn.on('data', (data) => {
          if (data.type === 'JOIN_PLAYER') {
            state.players[data.user.id] = data.user;
            broadcastState();
            render();
          } else if (data.type === 'UPDATE_MATCH') {
            applyMatchUpdateOnHost(data.match);
          }
        });
        conn.on('close', () => {
          state.connections = state.connections.filter(c => c !== conn);
        });
      });

      peer.on('error', () => {
        setState({ connStatus: 'error', errorMsg: '방 개설 중 오류가 발생했습니다. 새로고침 후 다시 눌러주세요.' });
      });
    }

    function joinStudent(e) {
      e.preventDefault();
      AudioFX.init();
      const codeInput = document.getElementById('input-code').value.trim();
      const nameInput = document.getElementById('input-name').value.trim();
      if (!codeInput || !nameInput) return;

      if (typeof Peer === 'undefined') {
        setState({ errorMsg: '인터넷 연결 또는 PeerJS 라이브러리 로딩을 확인해주세요.' });
        return;
      }

      setState({ connStatus: 'connecting', errorMsg: '', roomCode: codeInput });
      const userObj = { id: 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6), name: nameInput };

      const peer = new Peer();
      state.peer = peer;

      peer.on('open', () => {
        const conn = peer.connect(`yut-class-${codeInput}`, { reliable: true });
        state.hostConn = conn;

        conn.on('open', () => {
          setState({ mode: 'student', currentUser: userObj, connStatus: 'connected' });
          conn.send({ type: 'JOIN_PLAYER', user: userObj });
        });

        conn.on('data', (data) => {
          if (data.type === 'SYNC_STATE') {
            setState({ players: data.players || {}, matches: data.matches || {} });
          }
        });

        conn.on('close', () => {
          setState({ connStatus: 'error', errorMsg: '선생님 방과 연결이 끊어졌습니다.' });
        });
      });

      peer.on('error', () => {
        setState({ connStatus: 'error', errorMsg: '방 번호를 찾을 수 없습니다. 칠판의 4자리 숫자를 확인하세요!' });
      });
    }

    function updateMatch(updatedMatch) {
      state.selectedMoveIdx = 0;
      if (state.mode === 'host') {
        applyMatchUpdateOnHost(updatedMatch);
      } else if (state.hostConn && state.hostConn.open) {
        state.hostConn.send({ type: 'UPDATE_MATCH', match: updatedMatch });
      }
    }

    // =========================================================================
    // 4. 대진표 생성 및 게임 액션
    // =========================================================================
    function generateBracket() {
      const list = Object.values(state.players);
      if (list.length < 2) {
        alert('최소 2명 이상의 학생이 입장해야 대진표를 만들 수 있습니다.');
        return;
      }
      const shuffled = [...list].sort(() => Math.random() - 0.5);
      const totalSlots = Math.pow(2, Math.ceil(Math.log2(shuffled.length)));
      const rounds = Math.log2(totalSlots);
      const newMatches = {};

      const r1Count = totalSlots / 2;
      for (let i = 0; i < r1Count; i++) {
        const p1 = shuffled[i * 2] || null;
        const p2 = shuffled[i * 2 + 1] || null;
        const mId = `R1_M${i}`;
        const isBye = p1 && !p2;
        newMatches[mId] = { id: mId, round: 1, index: i, p1, p2, winner: isBye ? p1 : null };
      }

      for (let r = 2; r <= rounds; r++) {
        const count = totalSlots / Math.pow(2, r);
        for (let i = 0; i < count; i++) {
          const mId = `R${r}_M${i}`;
          newMatches[mId] = { id: mId, round: r, index: i, p1: null, p2: null, winner: null };
        }
      }

      Object.values(newMatches).forEach(m => {
        if (m.round === 1 && m.winner && rounds >= 2) {
          const nextId = `R2_M${Math.floor(m.index / 2)}`;
          if (m.index % 2 === 0) newMatches[nextId].p1 = m.winner;
          else newMatches[nextId].p2 = m.winner;
        }
      });

      state.matches = newMatches;
      broadcastState();
      render();
    }

    function resetMatches() {
      if (!confirm('대진표만 초기화할까요? (입장한 학생 명단은 유지됩니다)')) return;
      state.matches = {};
      state.activeMatchId = null;
      broadcastState();
      render();
    }

    function addDemoStudents() {
      const names = ['1번 김민준', '2번 이서연', '3번 박지호', '4번 최수아'];
      names.forEach((n, idx) => {
        const id = 'demo_' + idx;
        state.players[id] = { id, name: n };
      });
      broadcastState();
      render();
    }

    function getMatchGameState(match) {
      return match.gameState || {
        turn: 'p1',
        pieces: {
          p1: [{ id: 0, pos: -1, prev: -1 }, { id: 1, pos: -1, prev: -1 }],
          p2: [{ id: 0, pos: -1, prev: -1 }, { id: 1, pos: -1, prev: -1 }]
        },
        pendingMoves: [],
        lastRoll: null,
        rollCount: 0,
        canRoll: true,
        logs: ['경기가 시작되었습니다! 말 2개를 먼저 완주시키세요.']
      };
    }

    function handleRoll() {
      const match = state.matches[state.activeMatchId];
      if (!match) return;
      const gs = getMatchGameState(match);
      const myRole = match.p1?.id === state.currentUser?.id ? 'p1' : match.p2?.id === state.currentUser?.id ? 'p2' : null;
      if (!myRole || gs.turn !== myRole || !gs.canRoll || match.winner) return;

      AudioFX.playRoll();
      const result = rollYutSticks();
      if (result.extra) setTimeout(() => AudioFX.playFanfare(), 450);

      const newPending = [...(gs.pendingMoves || []), { name: result.name, steps: result.steps, desc: result.desc }];
      let nextCanRoll = result.extra;
      let nextTurn = gs.turn;
      const playerName = myRole === 'p1' ? match.p1.name : match.p2.name;
      let logMsg = `${playerName}님이 [${result.name}]을(를) 던졌습니다!`;

      const hasBoardPiece = gs.pieces[myRole].some(p => p.pos >= 0 && p.pos < 99);
      if (result.steps === -1 && !hasBoardPiece && newPending.length === 1 && !nextCanRoll) {
        logMsg += ' (나온 말이 없어 턴이 넘어갑니다)';
        nextTurn = myRole === 'p1' ? 'p2' : 'p1';
        newPending.length = 0;
        nextCanRoll = true;
      }

      updateMatch({
        ...match,
        gameState: {
          ...gs,
          turn: nextTurn,
          pendingMoves: newPending,
          lastRoll: result,
          rollCount: (gs.rollCount || 0) + 1,
          canRoll: nextCanRoll,
          logs: [logMsg, ...(gs.logs || []).slice(0, 7)]
        }
      });
    }

    function handleMovePiece(pieceIdx) {
      const match = state.matches[state.activeMatchId];
      if (!match) return;
      const gs = getMatchGameState(match);
      const myRole = match.p1?.id === state.currentUser?.id ? 'p1' : match.p2?.id === state.currentUser?.id ? 'p2' : null;
      if (!myRole || gs.turn !== myRole || match.winner) return;

      const moveIdx = state.selectedMoveIdx < gs.pendingMoves.length ? state.selectedMoveIdx : 0;
      const activeMove = gs.pendingMoves[moveIdx];
      if (!activeMove) return;

      const myPieces = gs.pieces[myRole].map(p => ({ ...p }));
      const oppRole = myRole === 'p1' ? 'p2' : 'p1';
      const oppPieces = gs.pieces[oppRole].map(p => ({ ...p }));
      const targetPiece = myPieces[pieceIdx];

      if (targetPiece.pos === 99) return;
      if (activeMove.steps === -1 && targetPiece.pos === -1) return;

      AudioFX.playWoodClack(0, 500);
      const dest = calculateDestination(targetPiece.pos, activeMove.steps, targetPiece.prev);
      const playerName = myRole === 'p1' ? match.p1.name : match.p2.name;

      const movingIndices = [pieceIdx];
      if (targetPiece.pos >= 0) {
        myPieces.forEach((p, idx) => {
          if (idx !== pieceIdx && p.pos === targetPiece.pos) movingIndices.push(idx);
        });
      }

      movingIndices.forEach(idx => {
        myPieces[idx].prev = dest === 99 ? 99 : targetPiece.pos;
        myPieces[idx].pos = dest;
      });

      let caught = false;
      if (dest !== 99 && dest >= 0) {
        oppPieces.forEach((op, idx) => {
          if (op.pos === dest) {
            oppPieces[idx] = { ...op, pos: -1, prev: -1 };
            caught = true;
          }
        });
      }

      if (caught) AudioFX.playCatch();
      if (dest === 99) AudioFX.playFanfare();

      const remainingMoves = gs.pendingMoves.filter((_, i) => i !== moveIdx);
      let nextCanRoll = gs.canRoll || caught;
      let nextTurn = gs.turn;

      let logMsg = `${playerName}: 말 ${movingIndices.map(i => i + 1).join(',')}번 [${activeMove.name}] 이동`;
      if (dest === 99) logMsg += ' 🎉 완주!';
      if (caught) logMsg += ' 💥 상대 말을 잡았습니다! (보너스 윷!)';

      const isWin = myPieces.every(p => p.pos === 99);
      if (isWin) {
        AudioFX.playFanfare();
        updateMatch({
          ...match,
          winner: match[myRole],
          gameState: {
            ...gs,
            pieces: { ...gs.pieces, [myRole]: myPieces, [oppRole]: oppPieces },
            pendingMoves: [],
            canRoll: false,
            logs: [`🏆 ${playerName}님이 승리하여 다음 라운드에 진출합니다!`, logMsg, ...(gs.logs || []).slice(0, 6)]
          }
        });
        return;
      }

      if (remainingMoves.length === 0 && !nextCanRoll) {
        nextTurn = oppRole;
        nextCanRoll = true;
      }

      updateMatch({
        ...match,
        gameState: {
          ...gs,
          turn: nextTurn,
          pieces: { ...gs.pieces, [myRole]: myPieces, [oppRole]: oppPieces },
          pendingMoves: remainingMoves,
          canRoll: nextCanRoll,
          logs: [logMsg, ...(gs.logs || []).slice(0, 7)]
        }
      });
    }

    // =========================================================================
    // 5. 전통 윷가락 그래픽 렌더러
    // =========================================================================
    function renderYutSticksVisual(lastRoll, rollCount) {
      if (!lastRoll) {
        return `
          <div class="flex flex-col items-center justify-center py-4 text-amber-900/60">
            <div class="flex gap-3 mb-2 opacity-60">
              ${[0,1,2,3].map(() => `
                <div class="w-6 h-20 rounded-full bg-gradient-to-r from-amber-700 via-amber-600 to-amber-800 border-2 border-amber-950 shadow-inner"></div>
              `).join('')}
            </div>
            <span class="text-xs font-bold">아래 버튼을 눌러 윷을 던져주세요!</span>
          </div>
        `;
      }

      const angles = [-8, 4, -3, 9];
      const sticksHtml = lastRoll.sticks.map((isFlat, i) => {
        // isFlat === true: 배(평평한 하얀 나무 면 + X 표시)
        // isFlat === false: 등(갈색 나무 껍질 면 + 전통 매듭 무늬)
        return `
          <div key="${rollCount}-${i}" style="--rot: ${angles[i]}deg"
            class="animate-yut-${i} relative w-8 h-24 rounded-full shadow-lg flex flex-col items-center justify-between py-2.5 border-2
            ${isFlat
              ? 'bg-gradient-to-b from-amber-50 via-orange-50 to-amber-100 border-amber-700 text-amber-900'
              : 'bg-gradient-to-r from-amber-900 via-amber-700 to-amber-900 border-stone-900 text-amber-200'}">
            ${isFlat ? `
              <span class="text-[11px] font-black leading-none">✕</span>
              <span class="text-[11px] font-black leading-none">${i === 0 && lastRoll.isBackDo ? '🔙' : '✕'}</span>
              <span class="text-[11px] font-black leading-none">✕</span>
            ` : `
              <div class="w-4 h-0.5 bg-amber-300/40 rounded"></div>
              <div class="w-3 h-3 rounded-full border border-amber-300/40"></div>
              <div class="w-4 h-0.5 bg-amber-300/40 rounded"></div>
            `}
          </div>
        `;
      }).join('');

      const badgeColor = lastRoll.extra
        ? 'bg-gradient-to-r from-red-600 to-amber-600 text-white ring-4 ring-amber-300'
        : lastRoll.isBackDo
          ? 'bg-stone-800 text-amber-300 ring-2 ring-stone-500'
          : 'bg-amber-800 text-amber-50';

      return `
        <div class="relative flex flex-col items-center justify-center py-2">
          <div class="flex items-center justify-center gap-3.5 my-1">
            ${sticksHtml}
          </div>
          <div class="animate-badge mt-2 px-5 py-1.5 rounded-full shadow-md flex items-center gap-2 ${badgeColor}">
            <span class="font-trad text-2xl font-black tracking-wider">${lastRoll.name}</span>
            <span class="text-xs font-bold opacity-90">(${lastRoll.desc})</span>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 6. 메인 화면 렌더러
    // =========================================================================
    function render() {
      const root = document.getElementById('app');

      // [화면 A] 초기 로그인 / 방 개설 화면
      if (!state.mode) {
        root.innerHTML = `
          <div class="min-h-screen flex items-center justify-center p-4">
            <div class="bg-[#fffdf9] p-8 rounded-3xl shadow-2xl max-w-md w-full border-4 border-amber-800 outline outline-2 outline-amber-400 -outline-offset-8 space-y-6">
              <div class="text-center">
                <div class="inline-block px-3 py-1 bg-red-800 text-amber-100 text-xs font-bold rounded-full mb-2">전통 민속놀이 한마당</div>
                <h1 class="font-trad text-3xl font-black text-stone-900">우리 반 2말 윷놀이</h1>
                <p class="text-sm text-stone-600 mt-1">칠판의 방 번호(4자리)와 내 이름을 입력하세요</p>
              </div>

              ${state.errorMsg ? `<div class="p-3 bg-rose-50 border border-rose-300 text-rose-800 text-xs rounded-xl font-bold">⚠️ ${state.errorMsg}</div>` : ''}

              <form id="join-form" class="space-y-3">
                <div>
                  <label class="block text-xs font-bold text-stone-700 mb-1">방 번호 (4자리 숫자)</label>
                  <input id="input-code" type="text" maxlength="4" placeholder="예: 4829" value="${state.roomCode}"
                    class="w-full px-4 py-3 rounded-xl border-2 border-amber-300 bg-amber-50/40 focus:border-red-700 focus:outline-none text-center font-black text-2xl tracking-widest text-stone-900" required />
                </div>
                <div>
                  <label class="block text-xs font-bold text-stone-700 mb-1">내 이름 (번호 + 이름)</label>
                  <input id="input-name" type="text" placeholder="예: 5번 김민준"
                    class="w-full px-4 py-3 rounded-xl border-2 border-amber-300 bg-amber-50/40 focus:border-red-700 focus:outline-none text-center font-bold text-lg text-stone-900" required />
                </div>
                <button type="submit" ${state.connStatus === 'connecting' ? 'disabled' : ''}
                  class="w-full py-3.5 bg-gradient-to-r from-red-700 to-red-800 hover:from-red-800 hover:to-red-900 text-amber-50 font-bold rounded-xl text-lg shadow-lg transition disabled:opacity-50 cursor-pointer">
                  ${state.connStatus === 'connecting' ? '방에 입장하는 중...' : '🏮 학생으로 입장하기'}
                </button>
              </form>

              <div class="border-t border-amber-200 pt-4 text-center">
                <button id="btn-host" type="button"
                  class="w-full py-3 bg-amber-700 hover:bg-amber-800 text-amber-50 font-bold rounded-xl text-sm shadow-sm transition cursor-pointer">
                  👑 선생님용: 새 토너먼트 방 개설하기
                </button>
              </div>
            </div>
          </div>
        `;
        document.getElementById('join-form').addEventListener('submit', joinStudent);
        document.getElementById('btn-host').addEventListener('click', startHost);
        return;
      }

      // [화면 B] 윷놀이 게임 보드 화면 (확대된 전통 윷판 + 전략 선택 UI)
      if (state.activeMatchId && state.matches[state.activeMatchId]) {
        const match = state.matches[state.activeMatchId];
        const gs = getMatchGameState(match);
        const isP1 = state.mode === 'student' && match.p1?.id === state.currentUser?.id;
        const isP2 = state.mode === 'student' && match.p2?.id === state.currentUser?.id;
        const myRole = isP1 ? 'p1' : isP2 ? 'p2' : null;
        const isMyTurn = !!myRole && gs.turn === myRole && !match.winner;
        const moveIdx = state.selectedMoveIdx < gs.pendingMoves.length ? state.selectedMoveIdx : 0;
        const activeMove = gs.pendingMoves[moveIdx] || null;

        // 이동 가능한 말 분석 (새 말 vs 판 위 기존 말)
        const previewMap = {};
        let waitingPieceIdx = -1;
        const activeBoardPieces = [];

        if (myRole) {
          gs.pieces[myRole].forEach((p, idx) => {
            if (p.pos === -1 && waitingPieceIdx === -1) waitingPieceIdx = idx;
            if (p.pos >= 0 && p.pos < 99) activeBoardPieces.push({ idx, pos: p.pos });
          });
        }

        if (isMyTurn && activeMove) {
          gs.pieces[myRole].forEach((p, idx) => {
            if (p.pos !== 99 && !(activeMove.steps === -1 && p.pos === -1)) {
              previewMap[calculateDestination(p.pos, activeMove.steps, p.prev)] = idx;
            }
          });
        }

        // 전통 문양 노드 SVG 생성
        const nodesSvg = Object.entries(NODES).map(([idStr, node]) => {
          const id = Number(idStr);
          const isPrev = previewMap[id] !== undefined;
          const r = node.big ? 5.2 : 3.3;
          return `
            <g class="${isPrev ? 'cursor-pointer node-target' : ''}" data-piece="${isPrev ? previewMap[id] : ''}">
              ${node.big ? `<circle cx="${node.x}" cy="${node.y}" r="${r + 1.4}" fill="none" stroke="${isPrev ? '#16a34a' : '#9a3412'}" stroke-width="0.5" stroke-dasharray="1.2,0.8" />` : ''}
              <circle cx="${node.x}" cy="${node.y}" r="${r}"
                fill="${isPrev ? '#22c55e' : node.center ? '#fef08a' : node.corner ? '#fee2e2' : '#fffbeb'}"
                stroke="${isPrev ? '#14532d' : '#78350f'}" stroke-width="${isPrev ? '1.3' : '0.9'}" />
              ${node.big ? `<circle cx="${node.x}" cy="${node.y}" r="1.4" fill="${isPrev ? '#ffffff' : '#9a3412'}" />` : ''}
              ${node.label ? `
                <text x="${node.x}" y="${node.y + (id === 0 ? 8.2 : id === 22 ? 8.0 : -6.8)}" font-size="2.7" text-anchor="middle" fill="#78350f" font-weight="900">
                  ${node.label}
                </text>
              ` : ''}
            </g>
          `;
        }).join('');

        // 판 위 말 렌더링 (업힌 말 표시 포함)
        const piecesHtml = ['p1', 'p2'].map(role =>
          gs.pieces[role].map((piece, idx) => {
            if (piece.pos < 0 || piece.pos === 99) return '';
            const node = NODES[piece.pos];
            // 같은 칸에 내 말이 업혀있는지 확인
            const stacked = gs.pieces[role].filter(p => p.pos === piece.pos).length > 1;
            const offset = role === 'p1' ? -2.0 : 2.0;
            const clickable = isMyTurn && role === myRole && activeMove;
            return `
              <button data-piece="${idx}" ${!clickable ? 'disabled' : ''}
                style="left: ${node.x + offset}%; top: ${node.y}%"
                class="board-piece absolute -translate-x-1/2 -translate-y-1/2 w-9 h-9 md:w-11 md:h-11 rounded-full font-black text-xs md:text-sm text-white shadow-xl flex flex-col items-center justify-center border-2 border-amber-200 transition-transform
                ${role === 'p1' ? 'bg-gradient-to-b from-blue-600 to-blue-800' : 'bg-gradient-to-b from-red-600 to-red-800'}
                ${clickable ? 'piece-glow ring-4 ring-emerald-400 scale-110 cursor-pointer z-20' : 'z-10'}">
                <span>${stacked ? '업힘' : (idx + 1) + '번'}</span>
              </button>
            `;
          }).join('')
        ).join('');

        // 말 선택 전략 가이드 박스 (이동권이 있을 때만 활성화)
        let strategyBoxHtml = '';
        if (isMyTurn && activeMove) {
          const canUseNew = waitingPieceIdx !== -1 && activeMove.steps > 0;
          const canUseExisting = activeBoardPieces.length > 0;
          strategyBoxHtml = `
            <div class="p-3.5 bg-emerald-50 border-2 border-emerald-500 rounded-2xl space-y-2 shadow-sm">
              <div class="text-xs font-black text-emerald-900 flex items-center justify-between">
                <span>🎯 [${activeMove.name}] 이동 선택: 어떤 말로 갈까요?</span>
              </div>
              <div class="grid grid-cols-1 gap-2">
                ${canUseNew ? `
                  <button data-piece="${waitingPieceIdx}" class="strategy-btn w-full py-2.5 px-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold flex items-center justify-between shadow cursor-pointer">
                    <span>🆕 대기 중인 새 말 (${waitingPieceIdx + 1}번 말) 출발시키기</span>
                    <span class="bg-emerald-800 px-2 py-0.5 rounded text-[11px]">출발 →</span>
                  </button>
                ` : ''}
                ${canUseExisting ? activeBoardPieces.map(bp => `
                  <button data-piece="${bp.idx}" class="strategy-btn w-full py-2.5 px-3 bg-amber-700 hover:bg-amber-800 text-amber-50 rounded-xl text-xs font-bold flex items-center justify-between shadow cursor-pointer">
                    <span>🏃 판 위의 ${bp.idx + 1}번 말로 계속 전진하기</span>
                    <span class="bg-amber-900 px-2 py-0.5 rounded text-[11px]">전진 →</span>
                  </button>
                `).join('') : ''}
              </div>
            </div>
          `;
        }

        root.innerHTML = `
          <div class="min-h-screen p-2 md:p-6">
            <div class="max-w-7xl mx-auto bg-[#fffdf9] rounded-3xl shadow-2xl p-4 md:p-6 border-4 border-amber-900/80">
              <!-- 상단 전광판 -->
              <div class="flex flex-wrap items-center justify-between gap-2 border-b-2 border-amber-200 pb-3 mb-5">
                <button id="btn-exit-match" class="px-3.5 py-2 text-sm bg-amber-100 hover:bg-amber-200 text-amber-950 rounded-xl font-bold cursor-pointer">← 대진표</button>
                
                <div class="flex items-center gap-3 md:gap-8">
                  <div class="px-5 py-2 rounded-2xl border-2 transition ${gs.turn === 'p1' ? 'border-blue-600 bg-blue-50 shadow-md scale-105' : 'border-transparent bg-stone-100 opacity-70'}">
                    <span class="text-[11px] font-black text-blue-700 block">청팀 (선공)</span>
                    <span class="font-black text-base md:text-xl text-stone-900">${match.p1?.name || '대기중'}</span>
                  </div>
                  <span class="font-trad font-black text-amber-800 text-2xl">對</span>
                  <div class="px-5 py-2 rounded-2xl border-2 transition ${gs.turn === 'p2' ? 'border-red-600 bg-red-50 shadow-md scale-105' : 'border-transparent bg-stone-100 opacity-70'}">
                    <span class="text-[11px] font-black text-red-700 block">홍팀 (후공)</span>
                    <span class="font-black text-base md:text-xl text-stone-900">${match.p2?.name || '대기중'}</span>
                  </div>
                </div>

                <div class="w-20 text-right">
                  ${match.winner ? '<span class="px-3 py-1 bg-amber-200 text-amber-950 rounded-full text-xs font-black">승부결정</span>' : '<span class="text-xs font-bold text-amber-700">2말 선승제</span>'}
                </div>
              </div>

              ${match.winner ? `
                <div class="mb-5 p-4 bg-gradient-to-r from-amber-100 via-yellow-100 to-amber-100 border-2 border-amber-500 rounded-2xl text-center shadow">
                  <p class="font-trad text-xl md:text-2xl font-black text-amber-950">🎊 경축! ${match.winner.name} 학생 승리! 다음 라운드로 진출합니다!</p>
                </div>
              ` : ''}

              <!-- 메인 게임 영역: 윷판을 7/12(약 60%)로 큼직하게 배치 -->
              <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                <!-- 좌측: 초대형 전통 윷판 -->
                <div class="lg:col-span-7 flex justify-center">
                  <div class="yut-mat relative w-full max-w-[640px] aspect-square rounded-3xl p-3 md:p-5">
                    <svg viewBox="0 0 100 100" class="w-full h-full">
                      <!-- 전통 창살 장식 테두리 및 대각선 -->
                      <rect x="11" y="11" width="78" height="78" fill="none" stroke="#78350f" stroke-width="1.2" />
                      <rect x="9.2" y="9.2" width="81.6" height="81.6" fill="none" stroke="#b45309" stroke-width="0.4" />
                      <line x1="11" y1="11" x2="89" y2="89" stroke="#78350f" stroke-width="1.1" />
                      <line x1="89" y1="11" x2="11" y2="89" stroke="#78350f" stroke-width="1.1" />
                      <!-- 중앙 태극/연꽃 장식 원 -->
                      <circle cx="50" cy="50" r="11" fill="none" stroke="#d97706" stroke-width="0.4" stroke-dasharray="1.5,1.5" />
                      ${nodesSvg}
                    </svg>
                    ${piecesHtml}
                  </div>
                </div>

                <!-- 우측: 윷 던지기 멍석 & 컨트롤 패널 -->
                <div class="lg:col-span-5 flex flex-col gap-4">
                  <!-- 양 팀 말 대기소 현황 -->
                  <div class="grid grid-cols-2 gap-3">
                    ${['p1', 'p2'].map(role => `
                      <div class="p-3 rounded-2xl border-2 ${role === 'p1' ? 'bg-blue-50/70 border-blue-300' : 'bg-red-50/70 border-red-300'}">
                        <div class="text-xs font-black mb-2 ${role === 'p1' ? 'text-blue-900' : 'text-red-900'}">
                          ${role === 'p1' ? match.p1?.name : match.p2?.name} 말 현황
                        </div>
                        <div class="flex gap-2">
                          ${gs.pieces[role].map((p, idx) => {
                            const isWaiting = p.pos === -1;
                            const isFin = p.pos === 99;
                            const canStart = isMyTurn && role === myRole && isWaiting && activeMove && activeMove.steps > 0;
                            return `
                              <button data-piece="${idx}" ${!canStart ? 'disabled' : ''}
                                class="start-piece flex-1 py-2.5 px-2 rounded-xl text-xs font-black border-2 transition
                                ${isFin ? 'bg-emerald-100 text-emerald-800 border-emerald-400' :
                                  isWaiting ? (role === 'p1' ? 'bg-blue-700 text-white border-blue-900' : 'bg-red-700 text-white border-red-900') :
                                  'bg-stone-200 text-stone-500 border-stone-300'}
                                ${canStart ? 'ring-4 ring-emerald-400 animate-pulse cursor-pointer' : ''}">
                                ${isFin ? `🏅 말${idx+1} 완주` : isWaiting ? `말${idx+1} 대기` : `말${idx+1} 출전`}
                              </button>
                            `;
                          }).join('')}
                        </div>
                      </div>
                    `).join('')}
                  </div>

                  <!-- 윷 던지기 멍석 패널 -->
                  <div class="p-4 bg-amber-100/70 rounded-2xl border-2 border-amber-400 shadow-inner">
                    <div class="flex items-center justify-between mb-2">
                      <span class="text-sm font-black text-amber-950">
                        ${match.winner ? '경기 종료' : isMyTurn ? '🔥 지금 내 차례입니다!' : `⏳ ${gs.turn === 'p1' ? match.p1?.name : match.p2?.name}님 순서`}
                      </span>
                      ${previewMap[99] !== undefined ? `
                        <button id="btn-goal" data-piece="${previewMap[99]}" class="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-black rounded-xl shadow animate-bounce cursor-pointer">
                          🎉 골인시키기!
                        </button>
                      ` : ''}
                    </div>

                    <!-- 윷가락 애니메이션 무대 -->
                    <div class="bg-[#fdf6e7] rounded-xl border border-amber-300 p-3 mb-3 min-h-[145px] flex items-center justify-center overflow-hidden">
                      ${renderYutSticksVisual(gs.lastRoll, gs.rollCount)}
                    </div>

                    <button id="btn-roll" ${(!isMyTurn || !gs.canRoll || match.winner) ? 'disabled' : ''}
                      class="w-full py-4 rounded-2xl font-black text-xl shadow-lg transition transform active:scale-95
                      ${isMyTurn && gs.canRoll && !match.winner
                        ? 'bg-gradient-to-r from-red-700 via-red-600 to-amber-600 hover:from-red-800 hover:to-amber-700 text-white cursor-pointer ring-2 ring-amber-300'
                        : 'bg-stone-300 text-stone-500 cursor-not-allowed'}">
                      ${!myRole ? '👀 관전 모드' : gs.canRoll ? '🎲 힘차게 윷 던지기!' : '⬇️ 아래에서 이동할 말을 선택하세요'}
                    </button>

                    <!-- 누적된 이동권(윷/모/잡기) 선택 탭 -->
                    ${gs.pendingMoves?.length > 0 ? `
                      <div class="mt-3 pt-3 border-t border-amber-300">
                        <p class="text-xs font-bold text-amber-900 mb-1.5">보유한 이동권 (${gs.pendingMoves.length}개):</p>
                        <div class="flex flex-wrap gap-2">
                          ${gs.pendingMoves.map((m, idx) => `
                            <button data-move-idx="${idx}" class="move-select px-3.5 py-1.5 rounded-xl text-sm font-black border-2 cursor-pointer transition
                              ${moveIdx === idx ? 'border-emerald-600 bg-emerald-600 text-white shadow' : 'border-amber-400 bg-white text-amber-900'}">
                              ${m.name} (${m.steps > 0 ? '+' + m.steps : m.steps}칸)
                            </button>
                          `).join('')}
                        </div>
                      </div>
                    ` : ''}
                  </div>

                  <!-- 새 말 vs 기존 말 선택 전략 가이드 -->
                  ${strategyBoxHtml}

                  <!-- 실시간 중계 기록 -->
                  <div class="p-3 bg-stone-900 text-amber-50 rounded-2xl text-xs space-y-1.5 h-32 overflow-y-auto border-2 border-amber-800">
                    ${(gs.logs || []).map((log, i) => `<div class="${i === 0 ? 'text-amber-300 font-bold' : 'text-stone-400'}">• ${log}</div>`).join('')}
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;

        document.getElementById('btn-exit-match').addEventListener('click', () => setState({ activeMatchId: null }));
        const rollBtn = document.getElementById('btn-roll');
        if (rollBtn) rollBtn.addEventListener('click', handleRoll);
        const goalBtn = document.getElementById('btn-goal');
        if (goalBtn) goalBtn.addEventListener('click', () => handleMovePiece(Number(goalBtn.dataset.piece)));

        document.querySelectorAll('.move-select').forEach(btn => {
          btn.addEventListener('click', () => setState({ selectedMoveIdx: Number(btn.dataset.moveIdx) }));
        });
        document.querySelectorAll('.start-piece, .board-piece, .node-target, .strategy-btn').forEach(el => {
          el.addEventListener('click', () => {
            if (el.dataset.piece !== '') handleMovePiece(Number(el.dataset.piece));
          });
        });
        return;
      }

      // [화면 C] 대진표 및 대기실 화면
      const playerList = Object.values(state.players);
      const matchList = Object.values(state.matches);
      const myActiveMatch = state.mode === 'student' && matchList.find(
        m => !m.winner && m.p1 && m.p2 && (m.p1.id === state.currentUser?.id || m.p2.id === state.currentUser?.id)
      );

      const roundsMap = {};
      matchList.forEach(m => {
        if (!roundsMap[m.round]) roundsMap[m.round] = [];
        roundsMap[m.round].push(m);
      });
      Object.keys(roundsMap).forEach(r => roundsMap[r].sort((a, b) => a.index - b.index));
      const totalRounds = Object.keys(roundsMap).length;

      root.innerHTML = `
        <div class="min-h-screen p-4 md:p-8 max-w-6xl mx-auto">
          <div class="flex flex-wrap items-center justify-between gap-4 bg-[#fffdf9] p-4 rounded-2xl shadow-md border-2 border-amber-800 mb-6">
            <div>
              <div class="flex items-center gap-2">
                <h1 class="font-trad text-xl md:text-2xl font-black text-stone-900">🏮 우리 반 전통 2말 윷놀이 대회</h1>
                <span class="px-3 py-1 bg-red-800 text-amber-100 font-black rounded-lg text-sm">방 코드: ${state.roomCode}</span>
              </div>
              <p class="text-sm text-stone-600 mt-1">
                ${state.mode === 'host'
                  ? `선생님 관리 화면 (${state.connStatus === 'connected' ? '🟢 방 개설 완료' : '🟡 방 연결 중...'} / 접속 학생: ${playerList.length}명)`
                  : `참가자: <strong class="text-red-800">${state.currentUser?.name}</strong> (총 ${playerList.length}명 참여 중)`}
              </p>
            </div>

            <div class="flex items-center gap-2">
              ${myActiveMatch ? `<button id="btn-my-match" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-xl shadow-lg animate-bounce cursor-pointer">⚔️ 내 경기 바로 입장하기!</button>` : ''}
              ${state.mode === 'host' ? `
                <button id="btn-gen" class="px-4 py-2.5 bg-red-700 hover:bg-red-800 text-amber-50 text-sm font-bold rounded-xl shadow cursor-pointer">🔀 대진표 자동 생성</button>
                <button id="btn-reset" class="px-3 py-2.5 bg-amber-100 hover:bg-amber-200 text-amber-900 text-xs font-bold rounded-xl cursor-pointer">대진표 초기화</button>
              ` : ''}
            </div>
          </div>

          ${matchList.length === 0 ? `
            <div class="bg-[#fffdf9] rounded-3xl p-8 text-center border-2 border-amber-700 shadow-lg">
              ${state.mode === 'host' ? `
                <div class="mb-6 p-5 bg-amber-50 border-2 border-amber-400 rounded-2xl inline-block">
                  <p class="text-sm text-amber-900 font-bold mb-1">학생들에게 아래 방 번호를 알려주세요!</p>
                  <p class="text-5xl font-black text-red-800 tracking-widest">${state.roomCode}</p>
                </div>
              ` : ''}
              <h2 class="font-trad text-xl font-bold text-stone-900 mb-2">
                ${state.mode === 'host' ? '학생들이 모두 입장하면 상단의 [대진표 자동 생성] 버튼을 눌러주세요!' : '선생님이 대진표를 생성할 때까지 잠시 기다려주세요!'}
              </h2>
              <p class="text-sm text-stone-500 mb-6">현재 입장 완료한 친구들 (${playerList.length}명)</p>
              <div class="flex flex-wrap justify-center gap-2.5 max-w-2xl mx-auto mb-6">
                ${playerList.map(p => `<span class="px-4 py-1.5 bg-amber-100 text-amber-950 font-bold rounded-full text-sm border border-amber-400">${p.name}</span>`).join('')}
              </div>
              ${state.mode === 'host' && playerList.length === 0 ? `
                <button id="btn-demo" class="px-3.5 py-2 text-xs bg-stone-200 hover:bg-stone-300 text-stone-700 font-bold rounded-lg cursor-pointer">🧪 테스트용 가상 학생 4명 추가</button>
              ` : ''}
            </div>
          ` : `
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 overflow-x-auto pb-4">
              ${Object.entries(roundsMap).map(([roundNum, rMatches]) => {
                const roundTitle = Number(roundNum) === totalRounds ? '🏆 장원 결정전 (결승)' :
                                   Number(roundNum) === totalRounds - 1 ? '🔥 준결승 (4강)' : `${roundNum}라운드`;
                return `
                  <div class="space-y-4">
                    <h3 class="font-trad font-black text-center text-amber-950 bg-amber-200/80 border border-amber-400 py-2.5 rounded-xl">${roundTitle}</h3>
                    ${rMatches.map(m => {
                      const canJoin = m.p1 && m.p2 && !m.winner;
                      const isMyGame = state.mode === 'student' && (m.p1?.id === state.currentUser?.id || m.p2?.id === state.currentUser?.id);
                      return `
                        <div class="bg-[#fffdf9] p-3.5 rounded-2xl border-2 shadow-sm space-y-2 ${isMyGame && !m.winner ? 'border-emerald-500 ring-4 ring-emerald-200' : 'border-amber-700/40'}">
                          <div class="flex items-center justify-between px-3 py-2 rounded-xl text-sm font-bold ${m.winner?.id === m.p1?.id ? 'bg-amber-200 text-amber-950 border border-amber-500' : 'bg-stone-100 text-stone-700'}">
                            <span>${m.p1 ? m.p1.name : '대기중...'}</span>
                            <div class="flex items-center gap-1">
                              ${m.winner?.id === m.p1?.id ? '<span>👑</span>' : ''}
                              ${state.mode === 'host' && m.p1 && !m.winner ? `<button data-mid="${m.id}" data-slot="p1" class="force-win px-2 py-0.5 bg-red-700 text-white text-[10px] rounded cursor-pointer">승</button>` : ''}
                            </div>
                          </div>
                          <div class="flex items-center justify-between px-3 py-2 rounded-xl text-sm font-bold ${m.winner?.id === m.p2?.id ? 'bg-amber-200 text-amber-950 border border-amber-500' : 'bg-stone-100 text-stone-700'}">
                            <span>${m.p2 ? m.p2.name : (m.round === 1 && m.p1 ? '부전승' : '대기중...')}</span>
                            <div class="flex items-center gap-1">
                              ${m.winner?.id === m.p2?.id ? '<span>👑</span>' : ''}
                              ${state.mode === 'host' && m.p2 && !m.winner ? `<button data-mid="${m.id}" data-slot="p2" class="force-win px-2 py-0.5 bg-red-700 text-white text-[10px] rounded cursor-pointer">승</button>` : ''}
                            </div>
                          </div>
                          ${canJoin ? `
                            <button data-mid="${m.id}" class="enter-match w-full py-2.5 text-white text-xs font-black rounded-xl transition cursor-pointer ${isMyGame ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-amber-800 hover:bg-amber-900'}">
                              ${isMyGame ? '🎮 내 대결 방 입장' : '👀 경기 관전하기'}
                            </button>
                          ` : ''}
                        </div>
                      `;
                    }).join('')}
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>
      `;

      const myMatchBtn = document.getElementById('btn-my-match');
      if (myMatchBtn) myMatchBtn.addEventListener('click', () => setState({ activeMatchId: myActiveMatch.id }));
      const genBtn = document.getElementById('btn-gen');
      if (genBtn) genBtn.addEventListener('click', generateBracket);
      const resetBtn = document.getElementById('btn-reset');
      if (resetBtn) resetBtn.addEventListener('click', resetMatches);
      const demoBtn = document.getElementById('btn-demo');
      if (demoBtn) demoBtn.addEventListener('click', addDemoStudents);

      document.querySelectorAll('.enter-match').forEach(btn => {
        btn.addEventListener('click', () => setState({ activeMatchId: btn.dataset.mid }));
      });
      document.querySelectorAll('.force-win').forEach(btn => {
        btn.addEventListener('click', () => {
          const m = state.matches[btn.dataset.mid];
          if (m) applyMatchUpdateOnHost({ ...m, winner: m[btn.dataset.slot] });
        });
      });
    }

    render();
  </script>
</body>
</html>
