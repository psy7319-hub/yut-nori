<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리 반 스피드 2말 윷놀이 토너먼트</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; user-select: none; }
  </style>
</head>
<body class="min-h-screen text-slate-800">
  <div id="app"></div>

  <script>
    // =========================================================================
    // 1. 윷놀이 판 좌표 및 규칙 엔진 (순수 JS)
    // =========================================================================
    const NODES = {
      0: { x: 88, y: 88, label: '출발/도착', big: true },
      1: { x: 88, y: 71 }, 2: { x: 88, y: 54 }, 3: { x: 88, y: 37 }, 4: { x: 88, y: 20 },
      5: { x: 88, y: 12, label: '모서리', big: true },
      6: { x: 71, y: 12 }, 7: { x: 54, y: 12 }, 8: { x: 37, y: 12 }, 9: { x: 20, y: 12 },
      10: { x: 12, y: 12, label: '모서리', big: true },
      11: { x: 12, y: 29 }, 12: { x: 12, y: 46 }, 13: { x: 12, y: 63 }, 14: { x: 12, y: 80 },
      15: { x: 12, y: 88, label: '모서리', big: true },
      16: { x: 29, y: 88 }, 17: { x: 46, y: 88 }, 18: { x: 63, y: 88 }, 19: { x: 80, y: 88 },
      20: { x: 73, y: 27 }, 21: { x: 61, y: 39 },
      22: { x: 50, y: 50, label: '방', big: true },
      23: { x: 39, y: 61 }, 24: { x: 27, y: 73 },
      25: { x: 27, y: 27 }, 26: { x: 39, y: 39 },
      27: { x: 61, y: 61 }, 28: { x: 73, y: 73 }
    };

    function getNextStep(pos, prevPos) {
      if (pos === -1) return 1;
      if (pos === 0 && prevPos !== -1) return 99;
      if (pos === 5) return 20;
      if (pos === 10) return 25;
      if (pos === 22) return prevPos === 21 ? 23 : 27;
      if (pos === 24) return 15;
      if (pos === 28) return 0;
      if (pos === 19) return 0;
      if (pos >= 20 && pos <= 23) return pos + 1;
      if (pos >= 25 && pos <= 27) return pos + 1;
      return pos + 1;
    }

    function calculateDestination(startPos, steps, prevPos = -1) {
      if (steps === -1) {
        if (startPos === -1) return -1;
        if (startPos === 1) return 0;
        if (startPos === 0) return 19;
        if (startPos === 20) return 5;
        if (startPos === 25) return 10;
        if (startPos === 23) return 22;
        if (startPos === 27) return 22;
        if (startPos === 15 && prevPos === 24) return 24;
        return startPos - 1;
      }
      let curr = startPos;
      let prev = prevPos;
      for (let i = 0; i < steps; i++) {
        const next = getNextStep(curr, prev);
        if (next === 99) return 99;
        prev = curr;
        curr = next;
      }
      return curr;
    }

    const YUT_RESULTS = [
      { name: '도', steps: 1, prob: 0.25, extra: false },
      { name: '개', steps: 2, prob: 0.37, extra: false },
      { name: '걸', steps: 3, prob: 0.25, extra: false },
      { name: '윷', steps: 4, prob: 0.06, extra: true },
      { name: '모', steps: 5, prob: 0.04, extra: true },
      { name: '빽도', steps: -1, prob: 0.03, extra: false }
    ];

    function rollYut() {
      const r = Math.random();
      let acc = 0;
      for (const item of YUT_RESULTS) {
        acc += item.prob;
        if (r <= acc) return item;
      }
      return YUT_RESULTS[1];
    }

    // =========================================================================
    // 2. 전역 상태 관리
    // =========================================================================
    const state = {
      mode: null, // null | 'host' | 'student'
      roomCode: '',
      currentUser: null,
      connStatus: 'disconnected', // disconnected | connecting | connected | error
      errorMsg: '',
      players: {},
      matches: {},
      activeMatchId: null,
      selectedMoveIdx: 0,
      peer: null,
      connections: [],
      hostConn: null
    };

    function setState(patch) {
      Object.assign(state, patch);
      render();
    }

    // =========================================================================
    // 3. P2P 통신 로직 (PeerJS)
    // =========================================================================
    function broadcastState() {
      const payload = {
        type: 'SYNC_STATE',
        players: state.players,
        matches: state.matches
      };
      state.connections.forEach(conn => {
        if (conn && conn.open) conn.send(payload);
      });
    }

    function applyMatchUpdateOnHost(updatedMatch) {
      const nextMatches = { ...state.matches, [updatedMatch.id]: updatedMatch };
      if (updatedMatch.winner) {
        const nextRound = updatedMatch.round + 1;
        const nextIndex = Math.floor(updatedMatch.index / 2);
        const nextMatchId = `R${nextRound}_M${nextIndex}`;
        if (nextMatches[nextMatchId]) {
          const slot = updatedMatch.index % 2 === 0 ? 'p1' : 'p2';
          nextMatches[nextMatchId] = { ...nextMatches[nextMatchId], [slot]: updatedMatch.winner };
        }
      }
      state.matches = nextMatches;
      broadcastState();
      render();
    }

    function startHost() {
      if (typeof Peer === 'undefined') {
        setState({ errorMsg: '인터넷 연결 또는 PeerJS 라이브러리 로딩을 확인해주세요.' });
        return;
      }
      const code = String(Math.floor(1000 + Math.random() * 9000));
      setState({ mode: 'host', roomCode: code, connStatus: 'connecting', errorMsg: '' });

      const peer = new Peer(`yut-class-${code}`);
      state.peer = peer;

      peer.on('open', () => {
        setState({ connStatus: 'connected' });
      });

      peer.on('connection', (conn) => {
        state.connections.push(conn);
        conn.on('open', () => {
          conn.send({ type: 'SYNC_STATE', players: state.players, matches: state.matches });
        });
        conn.on('data', (data) => {
          if (data.type === 'JOIN_PLAYER') {
            state.players[data.user.id] = data.user;
            broadcastState();
            render();
          } else if (data.type === 'UPDATE_MATCH') {
            applyMatchUpdateOnHost(data.match);
          }
        });
        conn.on('close', () => {
          state.connections = state.connections.filter(c => c !== conn);
        });
      });

      peer.on('error', () => {
        setState({ connStatus: 'error', errorMsg: '방 개설 중 오류가 발생했습니다. 새로고침 후 다시 눌러주세요.' });
      });
    }

    function joinStudent(e) {
      e.preventDefault();
      const codeInput = document.getElementById('input-code').value.trim();
      const nameInput = document.getElementById('input-name').value.trim();
      if (!codeInput || !nameInput) return;

      if (typeof Peer === 'undefined') {
        setState({ errorMsg: '인터넷 연결 또는 PeerJS 라이브러리 로딩을 확인해주세요.' });
        return;
      }

      setState({ connStatus: 'connecting', errorMsg: '', roomCode: codeInput });
      const userObj = { id: 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6), name: nameInput };

      const peer = new Peer();
      state.peer = peer;

      peer.on('open', () => {
        const conn = peer.connect(`yut-class-${codeInput}`, { reliable: true });
        state.hostConn = conn;

        conn.on('open', () => {
          setState({ mode: 'student', currentUser: userObj, connStatus: 'connected' });
          conn.send({ type: 'JOIN_PLAYER', user: userObj });
        });

        conn.on('data', (data) => {
          if (data.type === 'SYNC_STATE') {
            setState({ players: data.players || {}, matches: data.matches || {} });
          }
        });

        conn.on('close', () => {
          setState({ connStatus: 'error', errorMsg: '선생님 방과 연결이 끊어졌습니다.' });
        });
      });

      peer.on('error', () => {
        setState({ connStatus: 'error', errorMsg: '방 번호를 찾을 수 없습니다. 칠판의 4자리 숫자를 확인하세요!' });
      });
    }

    function updateMatch(updatedMatch) {
      state.selectedMoveIdx = 0;
      if (state.mode === 'host') {
        applyMatchUpdateOnHost(updatedMatch);
      } else if (state.hostConn && state.hostConn.open) {
        state.hostConn.send({ type: 'UPDATE_MATCH', match: updatedMatch });
      }
    }

    // =========================================================================
    // 4. 대진표 생성 및 게임 액션
    // =========================================================================
    function generateBracket() {
      const list = Object.values(state.players);
      if (list.length < 2) {
        alert('최소 2명 이상의 학생이 입장해야 대진표를 만들 수 있습니다.');
        return;
      }
      const shuffled = [...list].sort(() => Math.random() - 0.5);
      const totalSlots = Math.pow(2, Math.ceil(Math.log2(shuffled.length)));
      const rounds = Math.log2(totalSlots);
      const newMatches = {};

      const r1Count = totalSlots / 2;
      for (let i = 0; i < r1Count; i++) {
        const p1 = shuffled[i * 2] || null;
        const p2 = shuffled[i * 2 + 1] || null;
        const mId = `R1_M${i}`;
        const isBye = p1 && !p2;
        newMatches[mId] = { id: mId, round: 1, index: i, p1, p2, winner: isBye ? p1 : null };
      }

      for (let r = 2; r <= rounds; r++) {
        const count = totalSlots / Math.pow(2, r);
        for (let i = 0; i < count; i++) {
          const mId = `R${r}_M${i}`;
          newMatches[mId] = { id: mId, round: r, index: i, p1: null, p2: null, winner: null };
        }
      }

      Object.values(newMatches).forEach(m => {
        if (m.round === 1 && m.winner && rounds >= 2) {
          const nextId = `R2_M${Math.floor(m.index / 2)}`;
          if (m.index % 2 === 0) newMatches[nextId].p1 = m.winner;
          else newMatches[nextId].p2 = m.winner;
        }
      });

      state.matches = newMatches;
      broadcastState();
      render();
    }

    function resetMatches() {
      if (!confirm('대진표만 초기화할까요? (입장한 학생 명단은 유지됩니다)')) return;
      state.matches = {};
      state.activeMatchId = null;
      broadcastState();
      render();
    }

    function addDemoStudents() {
      const names = ['1번 김민준', '2번 이서연', '3번 박지호', '4번 최수아'];
      names.forEach((n, idx) => {
        const id = 'demo_' + idx;
        state.players[id] = { id, name: n };
      });
      broadcastState();
      render();
    }

    function getMatchGameState(match) {
      return match.gameState || {
        turn: 'p1',
        pieces: {
          p1: [{ id: 0, pos: -1, prev: -1 }, { id: 1, pos: -1, prev: -1 }],
          p2: [{ id: 0, pos: -1, prev: -1 }, { id: 1, pos: -1, prev: -1 }]
        },
        pendingMoves: [],
        canRoll: true,
        logs: ['경기가 시작되었습니다! 말 2개를 먼저 완주시키세요.']
      };
    }

    function handleRoll() {
      const match = state.matches[state.activeMatchId];
      if (!match) return;
      const gs = getMatchGameState(match);
      const myRole = match.p1?.id === state.currentUser?.id ? 'p1' : match.p2?.id === state.currentUser?.id ? 'p2' : null;
      if (!myRole || gs.turn !== myRole || !gs.canRoll || match.winner) return;

      const result = rollYut();
      const newPending = [...(gs.pendingMoves || []), { name: result.name, steps: result.steps }];
      let nextCanRoll = result.extra;
      let nextTurn = gs.turn;
      const playerName = myRole === 'p1' ? match.p1.name : match.p2.name;
      let logMsg = `${playerName}님이 [${result.name}]을(를) 던졌습니다!`;

      const hasBoardPiece = gs.pieces[myRole].some(p => p.pos >= 0 && p.pos < 99);
      if (result.steps === -1 && !hasBoardPiece && newPending.length === 1 && !nextCanRoll) {
        logMsg += ' (나온 말이 없어 턴이 넘어갑니다)';
        nextTurn = myRole === 'p1' ? 'p2' : 'p1';
        newPending.length = 0;
        nextCanRoll = true;
      }

      updateMatch({
        ...match,
        gameState: {
          ...gs,
          turn: nextTurn,
          pendingMoves: newPending,
          canRoll: nextCanRoll,
          logs: [logMsg, ...(gs.logs || []).slice(0, 7)]
        }
      });
    }

    function handleMovePiece(pieceIdx) {
      const match = state.matches[state.activeMatchId];
      if (!match) return;
      const gs = getMatchGameState(match);
      const myRole = match.p1?.id === state.currentUser?.id ? 'p1' : match.p2?.id === state.currentUser?.id ? 'p2' : null;
      if (!myRole || gs.turn !== myRole || match.winner) return;

      const moveIdx = state.selectedMoveIdx < gs.pendingMoves.length ? state.selectedMoveIdx : 0;
      const activeMove = gs.pendingMoves[moveIdx];
      if (!activeMove) return;

      const myPieces = gs.pieces[myRole].map(p => ({ ...p }));
      const oppRole = myRole === 'p1' ? 'p2' : 'p1';
      const oppPieces = gs.pieces[oppRole].map(p => ({ ...p }));
      const targetPiece = myPieces[pieceIdx];

      if (targetPiece.pos === 99) return;
      if (activeMove.steps === -1 && targetPiece.pos === -1) return;

      const dest = calculateDestination(targetPiece.pos, activeMove.steps, targetPiece.prev);
      const playerName = myRole === 'p1' ? match.p1.name : match.p2.name;

      const movingIndices = [pieceIdx];
      if (targetPiece.pos >= 0) {
        myPieces.forEach((p, idx) => {
          if (idx !== pieceIdx && p.pos === targetPiece.pos) movingIndices.push(idx);
        });
      }

      movingIndices.forEach(idx => {
        myPieces[idx].prev = dest === 99 ? 99 : targetPiece.pos;
        myPieces[idx].pos = dest;
      });

      let caught = false;
      if (dest !== 99 && dest >= 0) {
        oppPieces.forEach((op, idx) => {
          if (op.pos === dest) {
            oppPieces[idx] = { ...op, pos: -1, prev: -1 };
            caught = true;
          }
        });
      }

      const remainingMoves = gs.pendingMoves.filter((_, i) => i !== moveIdx);
      let nextCanRoll = gs.canRoll || caught;
      let nextTurn = gs.turn;

      let logMsg = `${playerName}: 말 ${movingIndices.map(i => i + 1).join(',')}번 [${activeMove.name}] 이동`;
      if (dest === 99) logMsg += ' 🎉 완주!';
      if (caught) logMsg += ' 💥 상대 말을 잡았습니다! (보너스 윷!)';

      const isWin = myPieces.every(p => p.pos === 99);
      if (isWin) {
        updateMatch({
          ...match,
          winner: match[myRole],
          gameState: {
            ...gs,
            pieces: { ...gs.pieces, [myRole]: myPieces, [oppRole]: oppPieces },
            pendingMoves: [],
            canRoll: false,
            logs: [`🏆 ${playerName}님이 승리하여 다음 라운드에 진출합니다!`, logMsg, ...(gs.logs || []).slice(0, 6)]
          }
        });
        return;
      }

      if (remainingMoves.length === 0 && !nextCanRoll) {
        nextTurn = oppRole;
        nextCanRoll = true;
      }

      updateMatch({
        ...match,
        gameState: {
          ...gs,
          turn: nextTurn,
          pieces: { ...gs.pieces, [myRole]: myPieces, [oppRole]: oppPieces },
          pendingMoves: remainingMoves,
          canRoll: nextCanRoll,
          logs: [logMsg, ...(gs.logs || []).slice(0, 7)]
        }
      });
    }

    // =========================================================================
    // 5. 화면 렌더링 함수
    // =========================================================================
    function render() {
      const root = document.getElementById('app');

      // [화면 A] 초기 로그인 / 방 개설 화면
      if (!state.mode) {
        root.innerHTML = `
          <div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-amber-50 to-orange-100">
            <div class="bg-white p-8 rounded-3xl shadow-xl max-w-md w-full border border-amber-200 space-y-6">
              <div class="text-center">
                <div class="text-5xl mb-2">🎲</div>
                <h1 class="text-2xl font-black text-slate-800">우리 반 2말 윷놀이 토너먼트</h1>
                <p class="text-sm text-slate-500 mt-1">선생님이 연 방 번호(4자리)와 내 이름을 입력하세요</p>
              </div>

              ${state.errorMsg ? `<div class="p-3 bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-xl font-bold">⚠️ ${state.errorMsg}</div>` : ''}

              <form id="join-form" class="space-y-3">
                <div>
                  <label class="block text-xs font-bold text-slate-600 mb-1">방 번호 (4자리 숫자)</label>
                  <input id="input-code" type="text" maxlength="4" placeholder="예: 4829" value="${state.roomCode}"
                    class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-indigo-500 focus:outline-none text-center font-black text-xl tracking-widest" required />
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-600 mb-1">내 이름 (번호 + 이름)</label>
                  <input id="input-name" type="text" placeholder="예: 5번 김민준"
                    class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-indigo-500 focus:outline-none text-center font-bold text-lg" required />
                </div>
                <button type="submit" ${state.connStatus === 'connecting' ? 'disabled' : ''}
                  class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-lg shadow-md transition disabled:bg-slate-400 cursor-pointer">
                  ${state.connStatus === 'connecting' ? '방에 연결하는 중...' : '학생으로 입장하기'}
                </button>
              </form>

              <div class="border-t pt-4 text-center">
                <button id="btn-host" type="button"
                  class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl text-sm shadow-sm transition cursor-pointer">
                  👩‍🏫 선생님용: 새 토너먼트 방 개설하기
                </button>
              </div>
            </div>
          </div>
        `;
        document.getElementById('join-form').addEventListener('submit', joinStudent);
        document.getElementById('btn-host').addEventListener('click', startHost);
        return;
      }

      // [화면 B] 윷놀이 게임 보드 화면
      if (state.activeMatchId && state.matches[state.activeMatchId]) {
        const match = state.matches[state.activeMatchId];
        const gs = getMatchGameState(match);
        const isP1 = state.mode === 'student' && match.p1?.id === state.currentUser?.id;
        const isP2 = state.mode === 'student' && match.p2?.id === state.currentUser?.id;
        const myRole = isP1 ? 'p1' : isP2 ? 'p2' : null;
        const isMyTurn = !!myRole && gs.turn === myRole && !match.winner;
        const moveIdx = state.selectedMoveIdx < gs.pendingMoves.length ? state.selectedMoveIdx : 0;
        const activeMove = gs.pendingMoves[moveIdx] || null;

        const previewMap = {};
        if (isMyTurn && activeMove) {
          gs.pieces[myRole].forEach((p, idx) => {
            if (p.pos !== 99 && !(activeMove.steps === -1 && p.pos === -1)) {
              previewMap[calculateDestination(p.pos, activeMove.steps, p.prev)] = idx;
            }
          });
        }

        const nodesSvg = Object.entries(NODES).map(([idStr, node]) => {
          const id = Number(idStr);
          const isPrev = previewMap[id] !== undefined;
          return `
            <g class="${isPrev ? 'cursor-pointer node-target' : ''}" data-piece="${isPrev ? previewMap[id] : ''}">
              <circle cx="${node.x}" cy="${node.y}" r="${node.big ? 4.8 : 3.2}"
                fill="${isPrev ? '#22c55e' : node.big ? '#fef3c7' : '#ffffff'}"
                stroke="${isPrev ? '#15803d' : '#b45309'}" stroke-width="${isPrev ? '1.2' : '0.8'}" />
              ${node.label ? `<text x="${node.x}" y="${node.y + (id === 0 ? 7.5 : -6)}" font-size="2.8" text-anchor="middle" fill="#92400e" font-weight="bold">${node.label}</text>` : ''}
            </g>
          `;
        }).join('');

        const piecesHtml = ['p1', 'p2'].map(role =>
          gs.pieces[role].map((piece, idx) => {
            if (piece.pos < 0 || piece.pos === 99) return '';
            const node = NODES[piece.pos];
            const offset = role === 'p1' ? -1.8 : 1.8;
            const clickable = isMyTurn && role === myRole && activeMove;
            return `
              <button data-piece="${idx}" ${!clickable ? 'disabled' : ''}
                style="left: ${node.x + offset}%; top: ${node.y}%"
                class="board-piece absolute -translate-x-1/2 -translate-y-1/2 w-7 h-7 rounded-full font-bold text-xs text-white shadow-md flex items-center justify-center border-2 border-white
                ${role === 'p1' ? 'bg-blue-600' : 'bg-rose-600'}
                ${clickable ? 'ring-4 ring-emerald-400 animate-bounce cursor-pointer z-10' : ''}">
                ${idx + 1}
              </button>
            `;
          }).join('')
        ).join('');

        root.innerHTML = `
          <div class="min-h-screen p-4 md:p-8">
            <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-lg p-4 md:p-6 border border-slate-200">
              <div class="flex items-center justify-between border-b pb-4 mb-4">
                <button id="btn-exit-match" class="px-3 py-1.5 text-sm bg-slate-100 hover:bg-slate-200 rounded-lg font-medium cursor-pointer">← 대진표로</button>
                <div class="flex items-center gap-3 md:gap-6">
                  <div class="px-4 py-2 rounded-xl border-2 ${gs.turn === 'p1' ? 'border-blue-500 bg-blue-50' : 'border-transparent bg-slate-50'}">
                    <span class="text-xs font-bold text-blue-600 block">선공 (파랑)</span>
                    <span class="font-bold text-base md:text-lg">${match.p1?.name || '대기중'}</span>
                  </div>
                  <span class="font-black text-slate-400 text-xl">VS</span>
                  <div class="px-4 py-2 rounded-xl border-2 ${gs.turn === 'p2' ? 'border-rose-500 bg-rose-50' : 'border-transparent bg-slate-50'}">
                    <span class="text-xs font-bold text-rose-600 block">후공 (빨강)</span>
                    <span class="font-bold text-base md:text-lg">${match.p2?.name || '대기중'}</span>
                  </div>
                </div>
                <div class="w-16 text-right">${match.winner ? '<span class="px-2.5 py-1 bg-amber-100 text-amber-800 rounded-full text-xs font-bold">종료</span>' : ''}</div>
              </div>

              ${match.winner ? `<div class="mb-4 p-4 bg-amber-50 border border-amber-300 rounded-xl text-center font-bold text-amber-900">🎉 ${match.winner.name} 학생 승리! 다음 라운드로 자동 진출했습니다.</div>` : ''}

              <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-start">
                <div class="md:col-span-7 relative aspect-square bg-amber-50/70 rounded-2xl border-2 border-amber-200 p-2">
                  <svg viewBox="0 0 100 100" class="w-full h-full">
                    <rect x="12" y="12" width="76" height="76" fill="none" stroke="#d97706" stroke-width="0.8" />
                    <line x1="12" y1="12" x2="88" y2="88" stroke="#d97706" stroke-width="0.8" stroke-dasharray="1.5,1" />
                    <line x1="88" y1="12" x2="12" y2="88" stroke="#d97706" stroke-width="0.8" stroke-dasharray="1.5,1" />
                    ${nodesSvg}
                  </svg>
                  ${piecesHtml}
                </div>

                <div class="md:col-span-5 flex flex-col gap-4">
                  <div class="grid grid-cols-2 gap-3">
                    ${['p1', 'p2'].map(role => `
                      <div class="p-3 rounded-xl border ${role === 'p1' ? 'bg-blue-50/60 border-blue-200' : 'bg-rose-50/60 border-rose-200'}">
                        <div class="text-xs font-bold mb-2 text-slate-600">${role === 'p1' ? match.p1?.name : match.p2?.name}의 말</div>
                        <div class="flex gap-2">
                          ${gs.pieces[role].map((p, idx) => {
                            const isWaiting = p.pos === -1;
                            const isFin = p.pos === 99;
                            const canStart = isMyTurn && role === myRole && isWaiting && activeMove && activeMove.steps > 0;
                            return `
                              <button data-piece="${idx}" ${!canStart ? 'disabled' : ''}
                                class="start-piece flex-1 py-2 px-2 rounded-lg text-xs font-bold border transition
                                ${isFin ? 'bg-emerald-100 text-emerald-700 border-emerald-300' :
                                  isWaiting ? (role === 'p1' ? 'bg-blue-600 text-white' : 'bg-rose-600 text-white') :
                                  'bg-slate-100 text-slate-400 border-slate-200'}
                                ${canStart ? 'ring-4 ring-emerald-400 animate-pulse cursor-pointer' : ''}">
                                ${isFin ? `말${idx+1} 완주!` : isWaiting ? `말${idx+1} 출발` : `말${idx+1} 출전중`}
                              </button>
                            `;
                          }).join('')}
                        </div>
                      </div>
                    `).join('')}
                  </div>

                  <div class="p-4 bg-slate-50 rounded-xl border border-slate-200">
                    <div class="flex items-center justify-between mb-3">
                      <span class="text-sm font-bold text-slate-700">
                        ${match.winner ? '경기 종료' : isMyTurn ? '🔥 내 차례입니다!' : `${gs.turn === 'p1' ? match.p1?.name : match.p2?.name}님의 차례`}
                      </span>
                      ${previewMap[99] !== undefined ? `<button id="btn-goal" data-piece="${previewMap[99]}" class="px-3 py-1 bg-emerald-600 text-white text-xs font-bold rounded-lg animate-bounce cursor-pointer">🎉 골인시키기!</button>` : ''}
                    </div>

                    <button id="btn-roll" ${(!isMyTurn || !gs.canRoll || match.winner) ? 'disabled' : ''}
                      class="w-full py-3.5 rounded-xl font-black text-lg shadow-sm transition
                      ${isMyTurn && gs.canRoll && !match.winner ? 'bg-indigo-600 hover:bg-indigo-700 text-white cursor-pointer' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}">
                      ${!myRole ? '👀 관전 모드' : gs.canRoll ? '🎲 윷 던지기!' : '말을 선택해 이동하세요'}
                    </button>

                    ${gs.pendingMoves?.length > 0 ? `
                      <div class="mt-3">
                        <p class="text-xs text-slate-500 mb-1.5">사용할 이동권을 선택 후 말을 클릭하세요:</p>
                        <div class="flex flex-wrap gap-2">
                          ${gs.pendingMoves.map((m, idx) => `
                            <button data-move-idx="${idx}" class="move-select px-3 py-1.5 rounded-lg text-sm font-bold border-2 cursor-pointer
                              ${moveIdx === idx ? 'border-emerald-600 bg-emerald-50 text-emerald-800' : 'border-slate-200 bg-white text-slate-600'}">
                              ${m.name} (${m.steps > 0 ? '+' + m.steps : m.steps}칸)
                            </button>
                          `).join('')}
                        </div>
                      </div>
                    ` : ''}
                  </div>

                  <div class="p-3 bg-slate-900 text-slate-100 rounded-xl text-xs space-y-1.5 h-36 overflow-y-auto">
                    ${(gs.logs || []).map((log, i) => `<div class="${i === 0 ? 'text-amber-300 font-bold' : 'text-slate-400'}">• ${log}</div>`).join('')}
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;

        document.getElementById('btn-exit-match').addEventListener('click', () => setState({ activeMatchId: null }));
        const rollBtn = document.getElementById('btn-roll');
        if (rollBtn) rollBtn.addEventListener('click', handleRoll);
        const goalBtn = document.getElementById('btn-goal');
        if (goalBtn) goalBtn.addEventListener('click', () => handleMovePiece(Number(goalBtn.dataset.piece)));

        document.querySelectorAll('.move-select').forEach(btn => {
          btn.addEventListener('click', () => setState({ selectedMoveIdx: Number(btn.dataset.moveIdx) }));
        });
        document.querySelectorAll('.start-piece, .board-piece, .node-target').forEach(el => {
          el.addEventListener('click', () => {
            if (el.dataset.piece !== '') handleMovePiece(Number(el.dataset.piece));
          });
        });
        return;
      }

      // [화면 C] 대진표 및 대기실 화면
      const playerList = Object.values(state.players);
      const matchList = Object.values(state.matches);
      const myActiveMatch = state.mode === 'student' && matchList.find(
        m => !m.winner && m.p1 && m.p2 && (m.p1.id === state.currentUser?.id || m.p2.id === state.currentUser?.id)
      );

      const roundsMap = {};
      matchList.forEach(m => {
        if (!roundsMap[m.round]) roundsMap[m.round] = [];
        roundsMap[m.round].push(m);
      });
      Object.keys(roundsMap).forEach(r => roundsMap[r].sort((a, b) => a.index - b.index));
      const totalRounds = Object.keys(roundsMap).length;

      root.innerHTML = `
        <div class="min-h-screen p-4 md:p-8 max-w-6xl mx-auto">
          <div class="flex flex-wrap items-center justify-between gap-4 bg-white p-4 rounded-2xl shadow-sm border border-slate-200 mb-6">
            <div>
              <div class="flex items-center gap-2">
                <h1 class="text-xl font-black text-slate-800">🎲 우리 반 스피드 2말 윷놀이 대회</h1>
                <span class="px-3 py-1 bg-indigo-100 text-indigo-800 font-black rounded-lg text-sm">방 코드: ${state.roomCode}</span>
              </div>
              <p class="text-sm text-slate-500 mt-1">
                ${state.mode === 'host'
                  ? `선생님 관리 화면 (${state.connStatus === 'connected' ? '🟢 방 개설 완료' : '🟡 방 연결 중...'} / 접속 학생: ${playerList.length}명)`
                  : `참가자: <strong>${state.currentUser?.name}</strong> (총 ${playerList.length}명 참여 중)`}
              </p>
            </div>

            <div class="flex items-center gap-2">
              ${myActiveMatch ? `<button id="btn-my-match" class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow animate-bounce cursor-pointer">⚔️ 내 경기 바로 입장하기!</button>` : ''}
              ${state.mode === 'host' ? `
                <button id="btn-gen" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold rounded-xl shadow-sm cursor-pointer">🔀 대진표 자동 생성</button>
                <button id="btn-reset" class="px-3 py-2.5 bg-rose-100 hover:bg-rose-200 text-rose-700 text-xs font-bold rounded-xl cursor-pointer">대진표 초기화</button>
              ` : ''}
            </div>
          </div>

          ${matchList.length === 0 ? `
            <div class="bg-white rounded-2xl p-8 text-center border border-slate-200 shadow-sm">
              ${state.mode === 'host' ? `
                <div class="mb-6 p-4 bg-amber-50 border border-amber-200 rounded-2xl inline-block">
                  <p class="text-sm text-amber-800 font-bold mb-1">학생들에게 아래 방 번호를 알려주세요!</p>
                  <p class="text-4xl font-black text-indigo-600 tracking-widest">${state.roomCode}</p>
                </div>
              ` : ''}
              <h2 class="text-lg font-bold text-slate-800 mb-2">
                ${state.mode === 'host' ? '학생들이 모두 입장하면 상단의 [대진표 자동 생성] 버튼을 눌러주세요!' : '선생님이 대진표를 생성할 때까지 잠시 기다려주세요!'}
              </h2>
              <p class="text-sm text-slate-500 mb-6">현재 입장 완료한 친구들 (${playerList.length}명)</p>
              <div class="flex flex-wrap justify-center gap-2 max-w-2xl mx-auto mb-6">
                ${playerList.map(p => `<span class="px-3.5 py-1.5 bg-indigo-50 text-indigo-700 font-bold rounded-full text-sm border border-indigo-100">${p.name}</span>`).join('')}
              </div>
              ${state.mode === 'host' && playerList.length === 0 ? `
                <button id="btn-demo" class="px-3 py-1.5 text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg cursor-pointer">🧪 테스트용 가상 학생 4명 추가</button>
              ` : ''}
            </div>
          ` : `
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 overflow-x-auto pb-4">
              ${Object.entries(roundsMap).map(([roundNum, rMatches]) => {
                const roundTitle = Number(roundNum) === totalRounds ? '🏆 결승전' :
                                   Number(roundNum) === totalRounds - 1 ? '🔥 준결승 (4강)' : `${roundNum}라운드`;
                return `
                  <div class="space-y-4">
                    <h3 class="font-black text-center text-slate-700 bg-slate-200/70 py-2 rounded-xl">${roundTitle}</h3>
                    ${rMatches.map(m => {
                      const canJoin = m.p1 && m.p2 && !m.winner;
                      const isMyGame = state.mode === 'student' && (m.p1?.id === state.currentUser?.id || m.p2?.id === state.currentUser?.id);
                      return `
                        <div class="bg-white p-3.5 rounded-xl border shadow-sm space-y-2 ${isMyGame && !m.winner ? 'border-emerald-500 ring-2 ring-emerald-200' : 'border-slate-200'}">
                          <div class="flex items-center justify-between px-3 py-2 rounded-lg text-sm font-bold ${m.winner?.id === m.p1?.id ? 'bg-amber-100 text-amber-900 border border-amber-300' : 'bg-slate-50 text-slate-700'}">
                            <span>${m.p1 ? m.p1.name : '대기중...'}</span>
                            <div class="flex items-center gap-1">
                              ${m.winner?.id === m.p1?.id ? '<span>👑</span>' : ''}
                              ${state.mode === 'host' && m.p1 && !m.winner ? `<button data-mid="${m.id}" data-slot="p1" class="force-win px-1.5 py-0.5 bg-amber-500 text-white text-[10px] rounded cursor-pointer">승</button>` : ''}
                            </div>
                          </div>
                          <div class="flex items-center justify-between px-3 py-2 rounded-lg text-sm font-bold ${m.winner?.id === m.p2?.id ? 'bg-amber-100 text-amber-900 border border-amber-300' : 'bg-slate-50 text-slate-700'}">
                            <span>${m.p2 ? m.p2.name : (m.round === 1 && m.p1 ? '부전승' : '대기중...')}</span>
                            <div class="flex items-center gap-1">
                              ${m.winner?.id === m.p2?.id ? '<span>👑</span>' : ''}
                              ${state.mode === 'host' && m.p2 && !m.winner ? `<button data-mid="${m.id}" data-slot="p2" class="force-win px-1.5 py-0.5 bg-amber-500 text-white text-[10px] rounded cursor-pointer">승</button>` : ''}
                            </div>
                          </div>
                          ${canJoin ? `
                            <button data-mid="${m.id}" class="enter-match w-full py-2 text-white text-xs font-bold rounded-lg transition cursor-pointer ${isMyGame ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-indigo-600 hover:bg-indigo-700'}">
                              ${isMyGame ? '🎮 내 대결 방 입장' : '👀 경기 관전하기'}
                            </button>
                          ` : ''}
                        </div>
                      `;
                    }).join('')}
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>
      `;

      const myMatchBtn = document.getElementById('btn-my-match');
      if (myMatchBtn) myMatchBtn.addEventListener('click', () => setState({ activeMatchId: myActiveMatch.id }));
      const genBtn = document.getElementById('btn-gen');
      if (genBtn) genBtn.addEventListener('click', generateBracket);
      const resetBtn = document.getElementById('btn-reset');
      if (resetBtn) resetBtn.addEventListener('click', resetMatches);
      const demoBtn = document.getElementById('btn-demo');
      if (demoBtn) demoBtn.addEventListener('click', addDemoStudents);

      document.querySelectorAll('.enter-match').forEach(btn => {
        btn.addEventListener('click', () => setState({ activeMatchId: btn.dataset.mid }));
      });
      document.querySelectorAll('.force-win').forEach(btn => {
        btn.addEventListener('click', () => {
          const m = state.matches[btn.dataset.mid];
          if (m) applyMatchUpdateOnHost({ ...m, winner: m[btn.dataset.slot] });
        });
      });
    }

    // 초기 화면 즉시 렌더링
    render();
  </script>
</body>
</html>
